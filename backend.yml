apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: lesson1-5
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
      - name: multitool
        image: wbitt/network-multitool
        ports:
        - containerPort: 8080
          name: port-multitool
        env:
          - name: HTTP_PORT
            value: "8080"
---
apiVersion: v1
kind: Service
metadata:
  name: api-svc
  namespace: lesson1-5
spec:
  selector:
    app: api
  ports:
    - name: port-multitool-svc
      protocol: TCP
      port: 8080
      targetPort: port-multitool
  type: ClusterIP
