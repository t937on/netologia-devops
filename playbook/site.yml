---
- name: Install Nginx
  hosts: lighthouse

  handlers:
    - name: Start nginx
      become: true
      ansible.builtin.command: nginx
      changed_when: false
    - name: Reload nginx
      become: true
      ansible.builtin.command: nginx -s reload
      changed_when: false

  tasks:
    - name: Install epel-release
      become: true
      ansible.builtin.yum:
        name: epel-release
        state: present

    - name: Install nginx
      become: true
      ansible.builtin.yum:
        name: nginx
        state: present
      notify: Start nginx

    - name: Create nginx config
      become: true
      ansible.builtin.template:
        src: "{{ nginx_config_template }}"
        dest: "{{ nginx_conf }}"
        mode: '0644'
      notify: Reload nginx


- name: Install Lighthouse
  hosts: lighthouse

  handlers:
    - name: Restart nginx
      become: true
      ansible.builtin.service:
        name: nginx
        state: restarted

  pre_tasks:
    - name: Install git
      become: true
      ansible.builtin.yum:
        name: git
        state: present

  tasks:
    - name: Clone Lighthouse repository
      become: true
      ansible.builtin.git:
        repo: "{{ lighthouse_vcs }}"
        dest: "{{ lighthouse_location_dir }}"
        version: master

    - name: Create Lighthouse config
      become: true
      ansible.builtin.template:
        src: "{{ lighthouse_config_template }}"
        dest: "{{ lighthouse_conf }}"
        mode: '0644'
      notify: Restart nginx

