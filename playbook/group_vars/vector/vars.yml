---
vector_name: "vector"
vector_user_name: "centos"

vector_version: "0.20.0"
vector_package: "vector-{{ vector_version }}-1.x86_64"
vector_url: "https://packages.timber.io/vector/{{ vector_version }}/{{ vector_package }}.rpm"

vector_bin: "/usr/bin"
vector_path: "/tmp/{{ vector_name }}"
vector_config_path: "/etc/{{ vector_name }}"

vector_data_dir: "/var/lib/{{ vector_name }}"

vector_config_template: "templates/vector_config.j2"
vector_service_config_template: "templates/vector_service_config.j2"


# config params
clickhouse_ip: "158.160.43.255"
clickhouse_db_name: "logs"
clickhouse_table_name: "my_table"

vector_config:
  sinks:
    to_clickhouse:
      type: clickhouse
      inputs:
        - our_log
      endpoint: "http://{{ clickhouse_ip }}:8123"
      database: "{{ clickhouse_db_name }}"
      table: "{{ clickhouse_table_name }}"
      compression: gzip
      healthcheck: false
      skip_unknown_fields: true
  sources:
    our_log:
      ignore_older_secs: 600
      include:
        - /home/centos/logs/*.log
      read_from: beginning
      type: file