stages:
  - build
  - deploy

variables:
  IMAGE_NAME: "netology/nginx_m10"
  KUBE_NAMESPACE: "lesson10"
  KUBECONFIG: "/root/.kube/config"

image: docker:latest
services:
  - docker:dind

before_script:
  - echo " CI_COMMIT_SHORT_SHA  = $CI_COMMIT_SHORT_SHA "
  - echo " CI_COMMIT_TAG  = $CI_COMMIT_TAG "

builder:
  stage: build
  script:
    - echo " USER  = $CI_REGISTRY_USER "
    - echo " PASSWORD   = $CI_REGISTRY_PASSWORD "
    - echo " REGISTRY  = $CI_REGISTRY "

    - |
      if [ -z "$CI_COMMIT_TAG" ]; then
        export IMAGE_TAG="$CI_COMMIT_SHORT_SHA"
      else
        export IMAGE_TAG="$CI_COMMIT_TAG"
      fi

    - docker build -t $CI_REGISTRY/$IMAGE_NAME:$IMAGE_TAG .
    #- docker login --username $CI_REGISTRY_USER --password $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - echo "$CI_REGISTRY_PASSWORD" | base64 -d | docker login --username $CI_REGISTRY_USER --password-stdin $CI_REGISTRY
    - docker push $CI_REGISTRY/$IMAGE_NAME:$IMAGE_TAG

deployer:
  stage: deploy
  script:
    - echo " KUBE CONFIG = $KUBE_CONFIG "
    - echo " KUBE NAMESPACE = $KUBE_NAMESPACE "
    - mkdir -p /root/.kube
    - chmod 700 /root/.kube
    - apk add --no-cache curl jq bash git
    - curl -LO https://dl.k8s.io/release/v1.32.0/bin/linux/amd64/kubectl
    - chmod +x ./kubectl && mv ./kubectl /usr/local/bin/kubectl
    - echo "$KUBE_CONFIG" | base64 -d > $KUBECONFIG
    - chmod 600 $KUBECONFIG
    - kubectl set image deployment/web-deployment web-nginx=$CI_REGISTRY/$IMAGE_NAME:$CI_COMMIT_TAG -n $KUBE_NAMESPACE
  only:
    - tags
